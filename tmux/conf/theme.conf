# ── System palette (sketchybar teal scheme) ──────
# bar=#001f30  item_bg=#003547  accent=#2cf9ed  border=#00c4b4
# ── Catppuccin Mocha (text/surface colors) ───────
# surface0=#313244  surface1=#45475a  surface2=#585b70
# overlay0=#6c7086  overlay2=#9399b2
# text=#cdd6f4  subtext0=#bac2de  subtext1=#a6adc8
# red=#f38ba8  green=#a6e3a1  yellow=#f9e2af

# ── Status bar ───────────────────────────────────
set -g status-position bottom
set -g status on
set -g status-justify absolute-centre
set -g status-left-length 80
set -g status-right-length 50
set -g status-style "bg=#001f30"

# ── Left: session name ──────────────────────────
# Use #{?} only around the color — no commas inside branches
set -g status-left " #[bg=#{?client_prefix,#f38ba8,#2cf9ed} fg=#001f30 bold] #S #[default] #[fg=#6c7086]│ #[fg=#00c4b4]#{=/-32/...:#{s|$HOME|~|:#{pane_current_path}}} #{?window_zoomed_flag,#[fg=#6c7086]│ #[fg=#f9e2af] zoom ,}"

# ── Right: battery + time ────────────────────────
set -g status-right ""

# ── Window tabs ──────────────────────────────────
set -g window-status-separator "#[fg=#6c7086]│"
set -g window-status-style "fg=#6c7086"
set -g window-status-format "  #I #W  "
set -g window-status-current-style "bg=#2cf9ed,fg=#001f30,bold"
set -g window-status-current-format "  #I #W  "
set -g window-status-last-style "fg=#9399b2"
set -g window-status-activity-style "fg=#f9e2af"
set -g window-status-bell-style "fg=#f38ba8"

# ── Panes ────────────────────────────────────────
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#2cf9ed"
set -g display-panes-colour "#45475a"
set -g display-panes-active-colour "#2cf9ed"

# ── Messages & mode ─────────────────────────────
set -g message-style "fg=#cdd6f4 bg=#313244"
set -g message-command-style "fg=#cdd6f4 bg=#313244"
set -g mode-style "fg=#cdd6f4 bg=#45475a"
set -g clock-mode-colour "#2cf9ed"

# ── Popups ───────────────────────────────────────
set -g popup-border-style "fg=#2cf9ed"
set -g popup-border-lines rounded
