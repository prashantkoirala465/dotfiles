# ── Catppuccin Mocha palette ─────────────────────
# bg=#1e1e2e  mantle=#181825  crust=#11111b
# surface0=#313244  surface1=#45475a  surface2=#585b70
# overlay0=#6c7086  overlay2=#9399b2
# text=#cdd6f4  subtext0=#bac2de  subtext1=#a6adc8
# teal=#94e2d5  red=#f38ba8  green=#a6e3a1
# yellow=#f9e2af  blue=#89b4fa  lavender=#b4befe

# ── Status bar ───────────────────────────────────
set -g status-position bottom
set -g status on
set -g status-justify absolute-centre
set -g status-left-length 50
set -g status-right-length 50
set -g status-style "bg=#181825"

# ── Left: session name ──────────────────────────
# Use #{?} only around the color — no commas inside branches
set -g status-left " #[bg=#{?client_prefix,#f38ba8,#94e2d5} fg=#11111b bold] #S #[default] #[fg=#6c7086]#{b:pane_current_path}"

# ── Right: battery + time ────────────────────────
set -g status-right "#[fg=#6c7086]#(pmset -g batt | grep -Eo '[0-9]+%%') #[fg=#45475a]| #[fg=#cdd6f4]%I:%M %p "

# ── Window tabs ──────────────────────────────────
set -g window-status-separator ""
set -g window-status-format "  #[fg=#6c7086]#I #W  "
set -g window-status-current-format "  #[fg=#94e2d5 bold]#I #W  "
set -g window-status-activity-style "fg=#f9e2af"
set -g window-status-bell-style "fg=#f38ba8"

# ── Panes ────────────────────────────────────────
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#94e2d5"
set -g display-panes-colour "#45475a"
set -g display-panes-active-colour "#94e2d5"

# ── Messages & mode ─────────────────────────────
set -g message-style "fg=#cdd6f4 bg=#313244"
set -g message-command-style "fg=#cdd6f4 bg=#313244"
set -g mode-style "fg=#cdd6f4 bg=#45475a"
set -g clock-mode-colour "#94e2d5"

# ── Popups ───────────────────────────────────────
set -g popup-style "bg=#1e1e2e"
set -g popup-border-style "fg=#94e2d5"
set -g popup-border-lines rounded
