bind Enter display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "$SHELL"

bind g if-shell 'command -v lazygit >/dev/null 2>&1' \
  'display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"' \
  'display-message "lazygit not found"'

bind f if-shell 'command -v fd >/dev/null 2>&1 && command -v fzf >/dev/null 2>&1' \
  'display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "sh -lc \"fd -t d . \"$HOME\" | fzf\""' \
  'choose-tree -Zw'

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel

unbind -T copy-mode-vi MouseDragEnd1Pane
