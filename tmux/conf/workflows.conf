bind Enter display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "$SHELL"

bind g if-shell 'command -v lazygit >/dev/null 2>&1' \
  'display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"' \
  'display-message "lazygit not found"'

bind f if-shell 'command -v fd >/dev/null 2>&1 && command -v fzf >/dev/null 2>&1' \
  'display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "sh -lc \"fd -t d . \"$HOME\" | fzf\""' \
  'choose-tree -Zw'

# Quick task popups
bind t display-popup -d "#{pane_current_path}" -w 80% -h 60% -E \
  "sh -lc 'if [ -f package.json ]; then npm test; elif [ -f go.mod ]; then go test ./...; else echo \"No test runner found\"; fi; read'"

bind b display-popup -d "#{pane_current_path}" -w 80% -h 60% -E \
  "sh -lc 'if [ -f package.json ]; then npm run build; elif [ -f go.mod ]; then go build ./...; else echo \"No build config found\"; fi; read'"

bind d display-popup -d "#{pane_current_path}" -w 80% -h 60% -E \
  "sh -lc 'if [ -f package.json ]; then npm run dev; elif [ -f go.mod ]; then go run .; else echo \"No dev command found\"; fi'"

# Vi copy mode with macOS clipboard
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send -X cancel

unbind -T copy-mode-vi MouseDragEnd1Pane
