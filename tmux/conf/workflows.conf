# ── Floating shell ───────────────────────────────
bind Enter display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "$SHELL"

# ── LazyGit ──────────────────────────────────────
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "env TERM=xterm-256color COLORTERM=truecolor lazygit"

# ── Yazi file manager ─────────────────────────────
bind C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi"

# ── FZF project finder ───────────────────────────
bind f display-popup -d "#{pane_current_path}" -w 80% -h 70% -E \
  "sh -lc 'fd -t d --max-depth 3 . \"$HOME\" | fzf --preview \"eza --tree --color=always --level=2 {}\"'"

# ── Quick task popups ────────────────────────────
bind t display-popup -d "#{pane_current_path}" -w 80% -h 60% -E \
  "sh -lc 'if [ -f package.json ]; then npm test; elif [ -f go.mod ]; then go test ./...; else echo \"No test runner found\"; fi; read'"

bind b display-popup -d "#{pane_current_path}" -w 80% -h 60% -E \
  "sh -lc 'if [ -f package.json ]; then npm run build; elif [ -f go.mod ]; then go build ./...; else echo \"No build config found\"; fi; read'"

bind d display-popup -d "#{pane_current_path}" -w 80% -h 60% -E \
  "sh -lc 'if [ -f package.json ]; then npm run dev; elif [ -f go.mod ]; then go run .; else echo \"No dev command found\"; fi'"

# ── Session picker (sesh — requires: brew install sesh) ──
bind s run-shell "sesh connect \"$(
    sesh list --icons | fzf-tmux -p 90%,80% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all | ^t tmux | ^g configs | ^x zoxide | ^f find | ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(all  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(tmux  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(conf  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(zox  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(find  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(kill  )+reload(sesh list --icons)' \
    --preview-window 'right:45%' \
    --preview 'sesh preview {}' \
)\""
