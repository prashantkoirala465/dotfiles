# ── Prefix ───────────────────────────────────────
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix
bind C-b send-prefix -2

# ── Splits (stay in current path) ────────────────
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Pane resize (vim-style, repeatable) ──────────
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# ── Pane navigation (C-hjkl via vim-tmux-navigator)

# ── Window navigation ────────────────────────────
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# ── Session / Window management ──────────────────
bind z resize-pane -Z
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind $ command-prompt -I "#S" "rename-session -- '%%'"
bind n command-prompt -p "new session:" "new-session -Ad -s '%%'"

# ── Vi copy mode ─────────────────────────────────
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# Vi motions already work: hjkl, w, b, e, /, ?, n, N, gg, G, C-u, C-d
unbind -T copy-mode-vi MouseDragEnd1Pane
