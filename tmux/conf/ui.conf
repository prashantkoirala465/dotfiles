set -g status-position bottom
set -g status-justify centre
set -g status on
set -g status-left-length 100
set -g status-right-length 120
set -g status-style "bg=colour234,fg=colour252"

set -g message-style "bg=colour238,fg=colour231"
set -g mode-style "bg=colour24,fg=colour231"

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

set -g window-status-separator ""
set -g window-status-style "bg=colour234,fg=colour245"
set -g window-status-current-style "bg=colour238,fg=colour81,bold"
set -g window-status-format " #[fg=colour245]#I:#W "
set -g window-status-current-format " #[fg=colour39,bold]#I:#W "
set -g window-status-activity-style "fg=colour220,bold"
set -g window-status-bell-style "fg=colour196,bold"

set -g status-left "#{?client_prefix,#[fg=colour16,bg=colour214,bold] PREFIX #[default],}#[fg=colour81,bold] #S #[fg=colour245]| #[fg=colour117]#{b:pane_current_path} "

set -g status-right "#{?#{&&:#{!=:#{@online_status},},#{!=:#{online_status},}},#[fg=colour42]#{online_status} #[fg=colour245]| ,}#{?#{&&:#{!=:#{@batt_remain_short},},#{!=:#{battery_percentage},}},#[fg=colour220]#{battery_icon} #{battery_percentage} #[fg=colour245]| ,}#[fg=colour250]%a %Y-%m-%d #[fg=colour39]%H:%M "
