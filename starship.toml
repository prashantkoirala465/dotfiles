"$schema" = 'https://starship.rs/config-schema.json'

# Palette (tmux teal system)
# seg1 = #2cf9ed  bright teal (accent)
# seg2 = #0ea5c0  mid teal    (directory)
# seg3 = #0a4a65  dark navy   (git)
# seg4 = #02202f  deep navy   (langs)
# seg5 = #010d18  near black  (time)

format = """
[░▒▓](#2cf9ed)\
[  ](bg:#2cf9ed fg:#001f30)\
[](bg:#0ea5c0 fg:#2cf9ed)\
$directory\
[](fg:#0ea5c0 bg:#0a4a65)\
$git_branch\
$git_status\
[](fg:#0a4a65 bg:#02202f)\
$nodejs\
$bun\
$golang\
$python\
[](fg:#02202f bg:#010d18)\
$time\
[ ](fg:#010d18)\
\n$character"""

add_newline = false

[character]
success_symbol = "[❯](bold #2cf9ed)"
error_symbol = "[❯](bold #f38ba8)"

[directory]
style = "fg:#001f30 bg:#0ea5c0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"projects" = "󰲋 "
"~" = "~"

[git_branch]
symbol = ""
style = "bg:#0a4a65"
format = '[[ $symbol $branch ](fg:#2cf9ed bg:#0a4a65)]($style)'
truncation_length = 25

[git_status]
style = "bg:#0a4a65"
format = '[[($all_status$ahead_behind )](fg:#2cf9ed bg:#0a4a65)]($style)'
ahead    = "⇡${count}"
behind   = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
staged   = "+${count}"
modified = "!${count}"
untracked = "?${count}"
deleted  = "✘${count}"
conflicted = "~${count}"

[nodejs]
symbol = ""
style = "bg:#02202f"
format = '[[ $symbol ($version) ](fg:#2cf9ed bg:#02202f)]($style)'
detect_files = ["package.json", ".node-version", ".nvmrc"]

[bun]
symbol = ""
style = "bg:#02202f"
format = '[[ $symbol ($version) ](fg:#2cf9ed bg:#02202f)]($style)'

[golang]
symbol = ""
style = "bg:#02202f"
format = '[[ $symbol ($version) ](fg:#2cf9ed bg:#02202f)]($style)'

[python]
symbol = ""
style = "bg:#02202f"
format = '[[ $symbol ($version) ](fg:#2cf9ed bg:#02202f)]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "bg:#010d18"
format = '[[  $time ](fg:#6c7086 bg:#010d18)]($style)'

[rust]
disabled = true

[docker_context]
disabled = true

[cmd_duration]
disabled = true
