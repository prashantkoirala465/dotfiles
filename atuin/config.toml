## Atuin configuration

# Search
search_mode = "fuzzy"
filter_mode = "global"
workspaces = true
style = "compact"
show_preview = true
inline_height = 40

# Behavior
enter_accept = true
keymap_mode = "vim-insert"
keymap_cursor = { vim_insert = "blink-bar", vim_normal = "steady-block" }

# Filter secrets from history
secrets_filter = true
history_filter = [
  "^export .*TOKEN",
  "^export .*SECRET",
  "^export .*PASSWORD",
  "^export .*KEY=",
]

[stats]
common_subcommands = [
  "cargo", "docker", "git", "go", "kubectl",
  "npm", "pnpm", "yarn", "bun", "tmux",
]
common_prefix = ["sudo"]
ignored_commands = ["cd", "ls", "exit", "clear"]

[keys]
scroll_exits = true

[sync]
records = true
