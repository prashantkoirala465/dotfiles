# ~/.aerospace.toml
# 10x Frontend Developer Configuration - Dual Monitor Optimized
# Your keybinds preserved + Smart workspace routing for productivity

# ============================================================
# STARTUP
# ============================================================
start-at-login = true

# ============================================================
# CORE SETTINGS
# ============================================================
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 0
key-mapping.preset = 'qwerty'

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = 'move-mouse window-lazy-center'

# ============================================================
# GAPS - Consistent across monitors
# ============================================================
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 5
outer.right = 10

# ============================================================
# WORKSPACE → MONITOR ASSIGNMENTS
# ============================================================
# Main Monitor (Laptop): Primary development work
# Secondary Monitor (External): Browser testing, reference, monitoring
[workspace-to-monitor-force-assignment]
# Main Monitor - Core Development
1 = 'main' # System & Utils (quick access)
2 = 'main' # Flex/Project workspace
3 = 'main' # Flex/Project workspace  
4 = 'main' # Flex/Project workspace
5 = 'main' # Flex/Project workspace
T = 'main' # Terminals (always on main for quick access)
P = 'main' # Dev Tools (VSCode, Cursor, GitHub, Postman)

# Secondary Monitor - Testing & Reference
B = 'secondary' # Browsers (Chrome/Safari for testing sites)
V = 'secondary' # Visual/Design (Figma, Neovim for reference)
6 = 'secondary' # Documents (for specs/documentation)
N = 'secondary' # Notes & Productivity (quick reference)

# Can be on either (flexible)
E = ['main', 'secondary'] # Media (background music)
M = ['main', 'secondary'] # Communication (check when needed)

# Workspaces 7-9 unassigned for dynamic project use

# ============================================================
# MAIN MODE - Your Original Keybinds (Preserved)
# ============================================================
[mode.main.binding]

# --- LAYOUT CONTROL ---
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# --- NAVIGATION (Your vim-style hjkl) ---
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# --- MOVE WINDOWS ---
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- WORKSPACES (Your original) ---
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-b = 'workspace B'
alt-e = 'workspace E'
alt-m = 'workspace M'
alt-n = 'workspace N'
alt-p = 'workspace P'
alt-t = 'workspace T'
alt-v = 'workspace V'

# --- MOVE TO WORKSPACE (Your original) ---
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-b = 'move-node-to-workspace B'
alt-shift-e = 'move-node-to-workspace E'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-n = 'move-node-to-workspace N'
alt-shift-p = 'move-node-to-workspace P'
alt-shift-t = 'move-node-to-workspace T'
alt-shift-v = 'move-node-to-workspace V'

# --- UTILITIES ---
alt-shift-f = 'fullscreen'
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# --- 10x DEV SHORTCUTS ---
# Quick window close (no service mode dance)
alt-shift-q = 'close'
# Quick float toggle for popovers/floating apps
alt-shift-space = 'layout floating tiling'
# Quick reload config without entering service mode
alt-shift-c = 'reload-config'

# --- MODE SWITCHING ---
alt-shift-semicolon = 'mode service'
alt-shift-r = 'mode resize'

# ============================================================
# RESIZE MODE - Your Original
# ============================================================
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
b = 'balance-sizes'
minus = 'resize smart -50'
equal = 'resize smart +50'
enter = 'mode main'
esc = 'mode main'

# ============================================================
# SERVICE MODE - Your Original
# ============================================================
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

