# Notes:
# - Removed 'layout floating' for Calculator, Dictionary, and Clock to fix the error, as 'move-node-to-workspace' must be the last command in the callback (see https://github.com/nikitabobko/AeroSpace/issues/20).
# - To make these apps float, you can manually toggle the floating layout after opening them (use alt-shift-semicolon, then f) or report the use case to the AeroSpace GitHub issue for future support.
# - Workspaces 2-5, 7-9 remain unassigned for project-specific tasks or flexibility.
