# ============================================================
# 10x FRONTEND DEVELOPER WORKFLOW GUIDE
# ============================================================
# Your Dual Monitor Setup:
# ┌──────────────────────┬──────────────────────┐
# │   MAIN MONITOR       │  SECONDARY MONITOR   │
# │   (Laptop)           │  (External)          │
# ├──────────────────────┼──────────────────────┤
# │ Alt+T: Terminals     │ Alt+B: Browsers      │ ← KEY
# │ Alt+P: Code (VS/Cur) │ Alt+V: Figma/Design  │
# │ Alt+1: System/Utils  │ Alt+6: Docs/Specs    │
# │ Alt+2-5: Projects    │ Alt+N: Notes         │
# │ Alt+M: Comms (flex)  │                      │
# │ Alt+E: Music (flex)  │                      │
# │ Alt+7-9: Free        │                      │
# └──────────────────────┴──────────────────────┘
#
# Frontend Developer Flow:
# 1. Code in VSCode/Cursor (Alt+P) on MAIN monitor
# 2. Run dev server in terminal (Alt+T) on MAIN monitor  
# 3. Test site in browser (Alt+B) on SECONDARY monitor ← You can see changes live!
# 4. Reference Figma designs (Alt+V) on SECONDARY monitor
# 5. Check documentation (Alt+6) on SECONDARY monitor
# 6. Use Alt+2-5 for multiple project workspaces
#
# Pro Tips:
# - Alt+Shift+Tab: Move entire workspace between monitors
# - Alt+Tab: Jump between last 2 workspaces (code ↔ browser)
# - Alt+Shift+F: Fullscreen browser for detailed testing
# - Keep Spotify (Alt+E) in background while coding
# - Alt+M for quick Slack checks without losing focus
#
# Your muscle memory preserved: hjkl navigation, all BENMPVT shortcuts intact!
